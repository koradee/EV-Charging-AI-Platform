server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend service locally if needed
    # Usually frontend calls backend URL directly (CORS), but proxy is cleaner
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    # }
}
